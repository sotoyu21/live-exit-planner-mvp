<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帰宅候補を選ぶ｜操作試作品</title><link rel="stylesheet" href="styles.css?v=route1"></head>
<body><main class="app-shell"><header class="topbar"><div class="brand-mark">↗</div><div><p class="eyebrow">到着地から選ぶ · 操作試作品</p><h1>ヨインミチ</h1><p>あと、何分観られる？</p></div></header>
<aside class="notice strong"><strong>画面操作用サンプル・料金は発生しません</strong><p>候補の時刻・路線・金額は架空です。実際の帰宅には使用できません。実ダイヤ検索は未接続です。</p></aside>
<section id="search-screen"><form id="route-form" class="form-grid">
<label>公演会場<select id="venue"></select></label><div class="two-column"><label>公演日<input id="date" type="date" required></label><label>終演予定<input id="end" type="time" value="20:00" required></label></div>
<p class="fine-print">出発地点は会場から自動設定。乗車駅・交通手段は候補ごとに比較します。</p>
<label>帰りたい場所・到着駅<input id="destination" placeholder="例：名古屋駅、宿泊先の最寄り駅" list="destinations" maxlength="80" required autocomplete="off"></label><datalist id="destinations"><option value="東京駅"><option value="名古屋駅"><option value="新大阪駅"><option value="横浜駅"><option value="大宮駅"></datalist>
<label>帰り方の条件<select id="timing"><option value="after">公演後に出発したい</option><option value="arrival">指定時刻までに到着したい</option><option value="departure">予約済み列車の発車時刻から逆算</option></select></label>
<label id="time-row" hidden><span id="time-label">到着したい時刻</span><input id="time" type="time" value="23:00"></label>
<label id="station-row" hidden>予約済み列車の乗車駅<input id="reserved-station" placeholder="駅名を検索・入力" list="stations" maxlength="80"></label><datalist id="stations"></datalist>
<details class="source-card"><summary>歩き方・座席などを調整</summary><div class="form-grid"><label>歩く速さ<select id="walking"><option value="normal">ふつう</option><option value="slow">ゆっくり</option></select></label><label>座席<select id="seat"><option value="unknown">不明</option><option value="rear_upper">後方・上層</option><option value="front">前方</option></select></label><label>大きな荷物<select id="luggage"><option value="no">なし</option><option value="yes">あり</option></select></label></div></details>
<p id="error" role="alert" class="error"></p><button class="primary">帰宅候補を比較する →</button></form></section>
<section id="results-screen" hidden><button id="edit" class="back">← 条件を変更</button><h2 id="results-title"></h2><p>架空の3候補です。実際の便の有無・運賃・乗車可否は確認していません。</p><label>並べ替え<select id="sort"><option value="watch">長く観られる順</option><option value="arrival">到着が早い順</option><option value="price">安い順</option></select></label><div id="results"></div></section>
<section id="detail-screen" hidden><button id="back-results" class="back">← 候補一覧へ</button><div id="detail"></div></section>
<footer class="footer"><a href="index.html">従来の試作品</a><span>操作試作品・課金なし</span></footer></main><script type="module" src="route-preview.js?v=1"></script></body></html>
